frr defaults datacenter
hostname spine4
!
interface lo
 ip address 10.0.0.14/32
!
route-map LOOPBACK permit 10
 match interface lo
!
router bgp 65200
 bgp router-id 10.0.0.14
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor eth1 interface remote-as external
 neighbor eth2 interface remote-as external
 neighbor eth1 bfd 3 300 300
 neighbor eth2 bfd 3 300 300
 !
 address-family ipv4 unicast
  redistribute connected route-map LOOPBACK
  maximum-paths 4
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor eth1 activate
  neighbor eth2 activate
  neighbor eth1 nexthop-unchanged
  neighbor eth2 nexthop-unchanged
 exit-address-family
!
